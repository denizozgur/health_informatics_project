[project]
name = "health-informatics-project"
version = "0.1.0"
description = "A minimal notebook environment for exploring MRI data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib",
    "nibabel",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
ecg = [
    "neurokit2==0.3.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
]
